name: Scala CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting and run all tests
        run: sbt "leetcodeScala3/scalafmtCheckAll; scalafmtSbtCheck; verify"
